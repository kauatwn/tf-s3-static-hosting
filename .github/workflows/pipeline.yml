name: "CI/CD: Static Hosting (LocalStack)"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Credenciais fictícias globais para o Terraform e AWS CLI apontarem para o LocalStack
env:
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_DEFAULT_REGION: "us-east-1"
  LOCALSTACK_ENDPOINT: "http://127.0.0.1:4566"

jobs:
  ci-build:
    name: "Build Frontend (Vite)"
    runs-on: ubuntu-24.04
    steps:
      - name: "Checkout repository 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup pnpm 📦"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11

      - name: "Setup Node.js ⚙️"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: "Install dependencies (Frozen Lockfile) 🧊"
        run: pnpm install --frozen-lockfile

      - name: "Run Prettier format check 💅"
        run: pnpm run format:check

      - name: "Run build 🔨"
        run: pnpm run build

      - name: "Upload Artifact (dist folder) 📦"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site-build
          path: dist/

  cd-deploy-localstack:
    name: "Provision & Deploy to LocalStack"
    runs-on: ubuntu-24.04
    needs: ci-build # Só executa se o build do frontend funcionar
    steps:
      - name: "Checkout repository 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Download Artifact (dist folder) 📦"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site-build
          path: dist/

      - name: "Start LocalStack 🐳"
        uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
        with:
          image-tag: "2026.07.0"
          install-awslocal: "true"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: "Setup Terraform 🛠️"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: "Terraform Format Check 🧹"
        working-directory: infra/environments/dev
        run: terraform fmt -check

      - name: "Terraform Init 🚀"
        working-directory: infra/environments/dev
        run: terraform init

      - name: "Terraform Validate ✅"
        working-directory: infra/environments/dev
        run: terraform validate

      - name: "Terraform Plan 📋"
        working-directory: infra/environments/dev
        run: terraform plan -out=tfplan

      - name: "Terraform Apply 🏗️"
        working-directory: infra/environments/dev
        run: terraform apply tfplan

      - name: "Deploy to S3 & Invalidate CloudFront Cache ☁️"
        working-directory: infra/environments/dev
        run: |
          # 1. Pega os nomes dos recursos criados pelo Terraform
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)

          echo "🚀 Enviando arquivos estáticos para o S3: $BUCKET_NAME"
          # O awslocal substitui o aws CLI e direciona o tráfego para o localhost:4566
          awslocal s3 sync $GITHUB_WORKSPACE/dist/ s3://$BUCKET_NAME --delete

          echo "🔄 Invalidando cache do CloudFront: $CF_DIST_ID"
          awslocal cloudfront create-invalidation --distribution-id $CF_DIST_ID --paths "/*"

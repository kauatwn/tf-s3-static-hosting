name: "CD: Static Hosting (LocalStack)"

on:
  workflow_run:
    workflows: ["CI: Static Hosting"]
    types:
      - completed
    branches: ["main"]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_PAGER: ""
  LOCALSTACK_ENDPOINT: "http://127.0.0.1:4566"

jobs:
  deploy:
    name: "Provision Infrastructure & Deploy"
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: "Checkout repository 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Download Build Artifact (from CI) 📦"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}-build
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Start LocalStack 🐳"
        uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
        with:
          image-tag: "2026.07.0"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: "Setup Terraform 🛠️"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: "Terraform Init 🚀"
        working-directory: infra/environments/dev
        run: terraform init

      - name: "Terraform Plan 📋"
        working-directory: infra/environments/dev
        run: |
          terraform plan \
            -var="localstack_endpoint=${{ env.LOCALSTACK_ENDPOINT }}" \
            -out=tfplan

      - name: "Terraform Apply 🏗️"
        working-directory: infra/environments/dev
        run: terraform apply -input=false tfplan

      - name: "Export Infrastructure Outputs 📤"
        id: infra-outputs
        working-directory: infra/environments/dev
        run: |
          echo "s3_bucket_name=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_domain_name=$(terraform output -raw cloudfront_domain_name)" >> "$GITHUB_OUTPUT"

      - name: "Deploy Static Assets to S3 📦"
        run: |
          echo "🚀 Uploading static files to S3 bucket: ${{ steps.infra-outputs.outputs.s3_bucket_name }}"
          aws --endpoint-url="${{ env.LOCALSTACK_ENDPOINT }}" s3 sync "$GITHUB_WORKSPACE/dist/" "s3://${{ steps.infra-outputs.outputs.s3_bucket_name }}" --delete

      - name: "Invalidate CloudFront Cache 🔄"
        run: |
          echo "🔄 Invalidating CloudFront cache: ${{ steps.infra-outputs.outputs.cloudfront_distribution_id }}"
          aws --endpoint-url="${{ env.LOCALSTACK_ENDPOINT }}" cloudfront create-invalidation \
            --distribution-id "${{ steps.infra-outputs.outputs.cloudfront_distribution_id }}" \
            --paths "/*"

      - name: "Run E2E Smoke Test 🧪"
        run: |
          echo "--- Verifying S3 Deployment ---"
          aws --endpoint-url="${{ env.LOCALSTACK_ENDPOINT }}" s3 ls "s3://${{ steps.infra-outputs.outputs.s3_bucket_name }}/"

          echo "--- Verifying index.html in S3 ---"
          aws --endpoint-url="${{ env.LOCALSTACK_ENDPOINT }}" s3api head-object \
            --bucket "${{ steps.infra-outputs.outputs.s3_bucket_name }}" \
            --key "index.html"

          echo "--- Verifying 404.html in S3 ---"
          aws --endpoint-url="${{ env.LOCALSTACK_ENDPOINT }}" s3api head-object \
            --bucket "${{ steps.infra-outputs.outputs.s3_bucket_name }}" \
            --key "404.html"

          echo "--- Verifying CloudFront Distribution State ---"
          aws --endpoint-url="${{ env.LOCALSTACK_ENDPOINT }}" cloudfront get-distribution \
            --id "${{ steps.infra-outputs.outputs.cloudfront_distribution_id }}" \
            --query "Distribution.Status" --output text

name: "CD: Static Hosting (LocalStack)"

on:
  workflow_run:
    workflows: ["CI: Static Hosting"]
    types:
      - completed
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    name: "Provision & Deploy to LocalStack"
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout repository 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Download Artifact (Automatic via workflow_run) 📦"
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}-build
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download Artifact (Manual via workflow_dispatch) 📦"
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.event.repository.name }}-build
          path: dist/

      - name: "Start LocalStack 🐳"
        uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
        with:
          image-tag: "2026.07.0"
          install-awslocal: "true"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: "Setup Terraform 🛠️"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: "Terraform Init 🚀"
        working-directory: infra/environments/dev
        run: terraform init

      - name: "Terraform Apply 🏗️"
        working-directory: infra/environments/dev
        run: terraform apply -auto-approve -input=false

      - name: "Deploy to S3 & Invalidate CloudFront Cache ☁️"
        working-directory: infra/environments/dev
        run: |
          # 1. Get resource names created by Terraform
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)

          echo "🚀 Uploading static files to S3: $BUCKET_NAME"
          awslocal s3 sync "$GITHUB_WORKSPACE/dist/" "s3://$BUCKET_NAME" --delete

          echo "🔄 Invalidating CloudFront cache: $CF_DIST_ID"
          awslocal cloudfront create-invalidation \
            --distribution-id "$CF_DIST_ID" \
            --paths "/*"

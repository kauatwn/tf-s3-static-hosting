name: "CD: Static Hosting (LocalStack)"

on:
  push:
    branches: ["main"]

env:
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_DEFAULT_REGION: "us-east-1"

jobs:
  deploy:
    name: "Provision & Deploy to LocalStack"
    runs-on: ubuntu-24.04

    steps:
      - name: "Checkout repository 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Download Artifact (dist folder) 📦"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site-build
          path: dist/

      - name: "Start LocalStack 🐳"
        uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
        with:
          image-tag: "2026.07.0"
          install-awslocal: "true"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: "Setup Terraform 🛠️"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: "Terraform Init 🚀"
        working-directory: infra/environments/dev
        run: terraform init

      - name: "Terraform Apply 🏗️"
        working-directory: infra/environments/dev
        run: terraform apply -auto-approve -input=false

      - name: "Deploy to S3 & Invalidate CloudFront Cache ☁️"
        working-directory: infra/environments/dev
        run: |
          # 1. Get resource names created by Terraform
          BUCKET_NAME=$(terraform output -raw s3_bucket_name)
          CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)

          echo "🚀 Uploading static files to S3: $BUCKET_NAME"
          # awslocal replaces the AWS CLI and routes traffic to LocalStack.
          awslocal s3 sync "$GITHUB_WORKSPACE/dist/" "s3://$BUCKET_NAME" --delete

          echo "🔄 Invalidating CloudFront cache: $CF_DIST_ID"
          awslocal cloudfront create-invalidation \
            --distribution-id "$CF_DIST_ID" \
            --paths "/*"

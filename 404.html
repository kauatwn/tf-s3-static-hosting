<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <link href="/src/style.css" rel="stylesheet" />
  </head>
  <body
    class="flex min-h-screen items-center justify-center bg-neutral-950 p-4 text-neutral-100"
  >
    <main
      class="flex w-full max-w-md flex-col justify-between rounded-xl border border-neutral-800 bg-neutral-900 p-6 shadow-2xl"
    >
      <!-- Header -->
      <header
        class="flex items-center space-x-3 border-b border-neutral-800 pb-6"
      >
        <div class="h-3 w-3 animate-pulse rounded-full bg-rose-500"></div>
        <h1 class="text-lg font-semibold tracking-wide text-neutral-100">
          404 - Page Not Found
        </h1>
      </header>

      <!-- Content / Info Grid -->
      <dl class="space-y-3 py-6 font-mono text-sm">
        <div class="flex justify-between">
          <dt class="text-neutral-400">Request Path:</dt>
          <dd id="request-path" class="font-medium text-rose-400">Unknown</dd>
        </div>
        <div class="flex justify-between">
          <dt class="text-neutral-400">Error Code:</dt>
          <dd class="font-medium text-amber-400">ERR_NOT_FOUND</dd>
        </div>
        <div class="flex justify-between">
          <dt class="text-neutral-400">HTTP Status:</dt>
          <dd class="text-neutral-200">404 Not Found</dd>
        </div>
      </dl>

      <!-- Action Button -->
      <div class="flex justify-center pb-2">
        <a
          href="/"
          class="rounded-lg border border-neutral-800 bg-neutral-950 px-4 py-2 text-xs font-semibold text-neutral-300 transition-colors hover:bg-neutral-800 hover:text-neutral-100"
        >
          Go Back Home
        </a>
      </div>

      <!-- Footer -->
      <footer class="mt-4 border-t border-neutral-800 pt-6">
        <p class="text-center text-xs text-neutral-400">
          Static asset pipeline operational. Route not found.
        </p>
      </footer>
    </main>
    <script>
      document.getElementById("request-path").textContent =
        window.location.pathname;
    </script>
  </body>
</html>
